[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sparkrl"
version = "0.1.0"
description = "AdaSpark: Self-Adaptive Big Data Programming using Reinforcement Learning and Spark"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyspark==3.5.9",
    "psutil==7.2.2",
    "PyYAML==6.0.3",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]
research = [
    "numpy==2.5.2",
    "pandas==2.3.3",
    "pyarrow==25.0.1",
    "scipy==1.18.1",
    "scikit-learn==1.9.0",
    "matplotlib==3.11.1",
    "seaborn==0.13.2",
    "gymnasium==1.3.0",
    "jupyterlab==4.6.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "unit: fast tests without Spark",
    "integration: tests that require a local Spark runtime",
    "system: end-to-end adaptive-loop tests",
]
