# EXP-008 A3/A4 configuration artifact - UNRESOLVED / FAIL-CLOSED TEMPLATE.
#
# Authority: DEC-030 (EXP-008 A3/A4 methodology freeze; execution NOT
# authorized) and DEC-031 (SC6 budget reconciliation; EXP-008 execution
# authorization = NO). The precedence order is PLAN.md > DECISIONS.md >
# DEC-030 > DEC-031.
#
# This file is INERT: nothing in the primary study, EXP-005/006/007, the
# baselines or the training loop loads it. It exists so that the frozen A3/A4
# methodology has a schema-safe, explicitly-unresolved representation.
#
# Every key left `null` is a DEC-030 UNRESOLVED methodological field. It is
# REQUIRED-BUT-UNSET: `sparkrl.training.exp008` refuses to make any arm
# configuration-complete until a later decision supplies it explicitly.
# `null` is never defaulted, and no value here changes the primary study.
#
# frozen (safe to state): experiment id, schema version, dataset seed 0,
#     split=train, q0_projection=false, the DEC-030 arm identities, the A4
#     action subset (frozen as mode4), and each A3 arm's own reward formula.
# unresolved (`null`): everything else, including the A4 control-pairing
